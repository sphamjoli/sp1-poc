services:
  anvil-mainnet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anvil-mainnet
    ports:
      - "8545:8545"
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8545",
        "--fork-url", "${MAINNET_RPC_URL}",
        "--disable-code-size-limit"
      ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-lc", "cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  anvil-base:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anvil-base
    ports:
      - "8546:8545"
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8545",
        "--fork-url", "${BASE_RPC_URL}",
        "--disable-code-size-limit"
      ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-lc", "cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
