[package]
name = "bridge-script"
edition.workspace = true
license.workspace = true
authors.workspace = true
exclude.workspace = true
version.workspace = true

[[bin]]
name = "bridge"
path = "src/main.rs"

[[bin]]
name = "evm"
path = "src/bin/evm.rs"

[[bin]]
name = "test-bridge"
path = "src/bin/test_bridge.rs"

[[bin]]
name = "exercise-bridge"
path = "src/bin/exercise_bridge.rs"

[[bin]]
name = "live-scenarios"
path = "src/bin/live_scenarios.rs"

[dependencies]
chain-manager = { workspace = true }
sp1-sdk = { workspace = true }
alloy = { workspace = true, features = ["full"] }
alloy-sol-types = { workspace = true }
alloy-primitives = { workspace = true }
alloy-consensus = { workspace = true }
alloy-provider = { workspace = true }
alloy-rpc-types = { workspace = true }
alloy-network = { workspace = true }
alloy-node-bindings = { workspace = true }
alloy-signer = { workspace = true }
alloy-signer-local = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
clap = { workspace = true }
dotenv = { workspace = true }
hex = { workspace = true }
eyre = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
futures = { workspace = true }
gql_client = { workspace = true }
mongodb = { workspace = true, features = ["rustls-tls", "compat-3-0-0"] }
bloomfilter = { workspace = true }
sha3 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
alloy-rlp = { workspace = true }
sp1-types = { workspace = true }
sp1-db = { workspace = true }
validator-utils = { workspace = true }
jsonrpsee = { workspace = true, features = ["full"] }
[build-dependencies]
sp1-build = { workspace = true }
