version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current; Dependabot bumps the pin and the
  # trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /apps/web
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /contracts
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /indexer
    schedule:
      interval: weekly
