name: Task
description: A unit of planned work.
labels: ["type: chore"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included, and what is out of scope.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Concrete, checkable acceptance criteria.
    validations:
      required: true
