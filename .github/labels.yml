# Type labels
- name: "type: bug"
  color: "d73a4a"
  description: "Something is broken"
- name: "type: feature"
  color: "a2eeef"
  description: "New functionality"
- name: "type: chore"
  color: "fef2c0"
  description: "Maintenance, refactoring, deps, CI"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation changes"
- name: "type: refactor"
  color: "d4c5f9"
  description: "Code restructuring without behaviour change"
- name: "type: perf"
  color: "fbca04"
  description: "Performance improvement"

# Component labels
- name: "component: proof"
  color: "c5def5"
  description: "SP1 guest program and protocol codecs"
- name: "component: runtime"
  color: "c5def5"
  description: "Rust runtime services and validator orchestration"
- name: "component: contracts"
  color: "c5def5"
  description: "Solidity bridge and staking contracts"
- name: "component: ui"
  color: "c5def5"
  description: "Vue and TypeScript browser interface"
- name: "component: docs"
  color: "c5def5"
  description: "Architecture and user documentation"
- name: "infra"
  color: "e6e6e6"
  description: "CI, build config, tooling"

# Priority labels
- name: "P0"
  color: "b60205"
  description: "Critical, blocks progress"
- name: "P1"
  color: "d93f0b"
  description: "High priority"
- name: "P2"
  color: "fbca04"
  description: "Normal priority"

# Status labels
- name: "blocked"
  color: "e4e669"
  description: "Blocked by an external dependency"
- name: "needs-info"
  color: "d876e3"
  description: "Waiting for more information"
- name: "duplicate"
  color: "cfd3d7"
  description: "Duplicate of another issue"
- name: "wontfix"
  color: "ffffff"
  description: "Will not be addressed"

- name: "component: indexer"
  color: "c5def5"
  description: "Envio handlers and event schemas"
