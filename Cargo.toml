[workspace]
members = [
  "crates/bridge-program",
  "crates/bridge-script",
  "crates/bridge-validator-evm",
  "crates/bls-test-utils",
  "crates/node-manager",
  "crates/validator-utils",
  "crates/chain-manager",
  "crates/sp1-types",
  "crates/sp1-db",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["brianspha"]
exclude = ["**/target"]
version = "0.1.0"

[workspace.dependencies]
eyre = { version = "0.6" }
tracing = { version = "0.1.40" }
tokio = { version = "1.40.0", features = ["full"] }
serde_json = { version = "1.0.94", features = ["alloc"] }
serde = { version = "=1.0.226", features = ["derive"] }
reqwest = { version = "0.12.15" }
url = { version = "2.3" }
hex-literal = { version = "0.4.1" }
bincode = { version = "1.3.3" }
dotenv = { version = "0.15.0" }
thiserror = { version = "2.0.12" }
futures = { version = "0.3.31" }
recall_merkle_tree_rs = { version = "0.1.0" }

# Alloy dependencies
alloy = { version = "1.0.36", features = ["full", "node-bindings"] }
alloy-primitives = { version = "1.4.1" }
alloy-sol-types = { version = "1.4.1" }
alloy-consensus = { version = "1.1.2" }
alloy-provider = { version = "1.1.2" }
alloy-rpc-types = { version = "1.1.2" }
alloy-network = { version = "1.1.2" }
alloy-node-bindings = { version = "1.1.2" }
alloy-signer = { version = "1.1.2" }
alloy-signer-local = { version = "1.1.2" }
alloy-trie = { version = "0.9.1" }
alloy-rlp = { version = "0.3.12" }
alloy-eips = { version = "1.1.2" }

# local crates
chain-manager = { path = "crates/chain-manager" }
bridge-script = { path = "crates/bridge-script" }
bridge-validator-evm = { path = "crates/bridge-validator-evm" }
bls-test-utils = { path = "crates/bls-test-utils" }
validator-utils = { path = "crates/validator-utils" }
sp1-types = { path = "crates/sp1-types" }
sp1-db = { path = "crates/sp1-db" }

# Database dependencies
mongodb = { version = "3.2.4", features = [
  "sync",
  "rustls-tls",
  "compat-3-0-0",
] }
bloomfilter = { version = "3.0.1" }

# SP1 dependencies
sp1-sdk = { version = "5.0.0" }
sp1-zkvm = { version = "5.0.0" }
sp1-build = { version = "5.0.0" }


# misc
clap = { version = "4.5.41", features = ["derive", "env"] }
hex = { version = "0.4.3", features = ["alloc"] }
gql_client = { version = "1.0.8" }
sha3 = { version = "0.11.0-rc.0" }
sylow = { version = "0.1.1" }
ark-bn254 = { version = "0.5.0" }
ark-ec = { version = "0.5.0" }
ark-ff = { version = "0.5.0" }
ark-serialize = { version = "0.5.0" }
ark-std = { version = "0.5.0" }
sha2 = { version = "0.11.0-pre.4" }
crypto-bigint = { version = "0.6.1" }
dashmap = { version = "6.1.0" }
serial_test = { version = "3.2.0" }
once_cell = { version = "1.21.3" }
jsonrpsee = { version = "0.26.0", features = ["full"] }
jsonrpsee-core = { version = "0.26.0" }
async-trait = { version = "0.1.88" }
reth-trie = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
tracing-subscriber = { version = "0.3.22" }

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rustdoc.all = "warn"
